/*
 * Messages (NEAR Protocol) for KeepKey Communication
 *
 * NEAR native account support via Ed25519 on the device.
 * Derivation path: m/44'/397'/0' (SLIP-0010 hardened-only)
 * Address: lowercase hex of 32-byte Ed25519 public key (implicit account)
 * Signing: Ed25519(SHA256(borsh_serialized_transaction))
 *
 * STATUS: SCHEMA ONLY -- NOT IMPLEMENTED BY FIRMWARE 7.15 / RC18.
 * This file exists so MessageType 1610-1613 stay allocated and the intended
 * wire surface is reviewable. That release ships no NEAR handler and answers
 * these requests with Failure_UnexpectedMessage. Hosts must not advertise NEAR
 * support on the basis of these bindings. nanopb bounds live in
 * messages-near.options so firmware can adopt the schema without a redesign.
 */

syntax = "proto2";

option java_package = "com.keepkey.deviceprotocol";
option java_outer_classname = "KeepKeyMessageNear";

/**
 * Request: Derive NEAR implicit account address at the given path
 * @next NearAddress
 * @next Failure
 */
message NearGetAddress {
    repeated uint32 address_n = 1;          // BIP-44 path (e.g. m/44'/397'/0')
    optional string coin_name = 2 [default = "NEAR"];
    optional bool show_display = 3;
}

/**
 * Response: NEAR implicit account address (lowercase hex of Ed25519 pubkey)
 * @prev NearGetAddress
 */
message NearAddress {
    optional string address = 1;            // lowercase hex of 32-byte Ed25519 pubkey
    optional bytes public_key = 2;          // Raw 32-byte Ed25519 pubkey
}

/**
 * Request: Sign a NEAR transaction
 *
 * The host Borsh-serializes the full NearTransaction and sends raw bytes.
 * Firmware SHA256-hashes the bytes, signs with Ed25519, returns 64-byte signature.
 *
 * CONFIRMATION CONTRACT: every value shown to the user MUST be derived by the
 * device from raw_tx. The signature covers only SHA256(raw_tx), so any
 * host-supplied display string is unauthenticated: a malicious host could show
 * a benign receiver and action while obtaining a signature over entirely
 * different bytes. A Borsh NearTransaction carries signer_id, public_key,
 * nonce, receiver_id, block_hash and the action list in the signed bytes
 * themselves, so the device has everything it needs without trusting the host.
 *
 * Tags 4 and 5 previously carried host-supplied receiver_id and action_display
 * for exactly that unsafe flow. They are reserved so no implementation can
 * reintroduce them. A device that cannot parse a given transaction must refuse
 * it rather than fall back to displaying host-provided text.
 *
 * @next NearSignedTx
 * @next Failure
 */
message NearSignTx {
    reserved 4, 5;
    reserved "receiver_id", "action_display";
    repeated uint32 address_n = 1;          // BIP-44 path to signing key
    optional string coin_name = 2 [default = "NEAR"];
    optional bytes raw_tx = 3;              // Borsh-serialized NearTransaction (max 1024 bytes).
                                            // Sole source of truth for on-screen confirmation:
                                            // the device parses receiver_id and the action list
                                            // out of these bytes before signing them.
}

/**
 * Response: Ed25519 signature over SHA256(raw_tx)
 * @prev NearSignTx
 */
message NearSignedTx {
    optional bytes signature = 1;           // 64-byte Ed25519 signature
    optional bytes public_key = 2;          // 32-byte Ed25519 pubkey (for verification)
}
