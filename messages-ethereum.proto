/*
 * Messages for KeepKey Communication
 *
 */

syntax = "proto2";

// Sugar for easier handling in Java
option java_package = "com.keepkey.deviceprotocol";
option java_outer_classname = "KeepKeyMessageEthereum";

import "types.proto";

/**
 * Request: Ask device for Ethereum address corresponding to address_n path
 * @next PassphraseRequest
 * @next EthereumAddress
 * @next Failure
 */
message EthereumGetAddress {
	repeated uint32 address_n = 1;			// BIP-32 path to derive the key from master node
	optional bool show_display = 2;			// optionally show on display before sending the result
}

/**
 * Response: Contains an Ethereum address derived from device private seed
 * @prev EthereumGetAddress
 */
message EthereumAddress {
	required bytes address = 1;		// Coin address as an Ethereum 160 bit hash
	optional string address_str = 2;
}

/**
 * Request: Ask device to sign transaction
 * All fields are optional from the protocol's point of view. Each field defaults to value `0` if missing.
 * Note: the first at most 1024 bytes of data MUST be transmitted as part of this message.
 * @next PassphraseRequest
 * @next PinMatrixRequest
 * @next EthereumTxRequest
 * @next Failure
 */
message EthereumSignTx {
	repeated uint32 address_n = 1;			// BIP-32 path to derive the key from master node
	optional bytes nonce = 2;			// <=256 bit unsigned big endian
	optional bytes gas_price = 3;			// <=256 bit unsigned big endian (in wei)
	optional bytes gas_limit = 4;			// <=256 bit unsigned big endian
	optional bytes to = 5;				// 160 bit address hash
	optional bytes value = 6;			// <=256 bit unsigned big endian (in wei)
	optional bytes data_initial_chunk = 7;		// The initial data chunk (<= 1024 bytes)
	optional uint32 data_length = 8;		// Length of transaction payload
	repeated uint32 to_address_n = 9;               // BIP-32 path to derive key for fund transfer
	optional OutputAddressType address_type = 10;	// output address type 
	reserved 11;
	optional uint32 chain_id = 12;			// Chain Id for EIP 155
	optional bytes max_fee_per_gas = 13;		// EIP-1559 - The maximum total fee per gas the sender is willing to pay. <=256 bit unsigned big endian (in wei)
	optional bytes max_priority_fee_per_gas = 14;	// EIP-1559 - Maximum fee per gas the sender is willing to pay to miners. <=256 bit unsigned big endian (in wei)
	optional bytes token_value = 100;		// How many tokens to send
	optional bytes  token_to = 101;			// 160 bit address hash to send tokens to
	optional string token_shortcut = 102; 		// 3 or 4 character token identifier
	optional uint32 tx_type = 103;			// (only for Wanchain)
	optional uint32 type = 104;			// Ethereum tx type (0=Legacy, 1=EIP-2930, 2=EIP-1559)
}

/**
 * Response: Device asks for more data from transaction payload, or returns the signature.
 * If data_length is set, device awaits that many more bytes of payload.
 * Otherwise, the signature_* fields contain the computed transaction signature. All three fields will be present.
 * @prev EthereumSignTx
 * @next EthereumTxAck
 */
message EthereumTxRequest {
	optional uint32 data_length = 1;  // Number of bytes being requested (<= 1024)
	optional uint32 signature_v = 2;  // Computed signature (recovery parameter, limited to 27 or 28)
	optional bytes signature_r = 3;	  // Computed signature R component (256 bit)
	optional bytes signature_s = 4;	  // Computed signature S component (256 bit)
	optional bytes hash = 5;	  // Computed hash using SHA3 (keccak_ctx)
  optional bytes signature_der = 6; // Computed signature in DER format
}

/**
 * Request: Transaction payload data.
 * @prev EthereumTxRequest
 * @next EthereumTxRequest
 */
message EthereumTxAck {
	optional bytes data_chunk = 1;			// Bytes from transaction payload (<= 1024 bytes)
}

///////////////////////////////////////////
// Ethereum: Clear signing metadata     //
///////////////////////////////////////////

/**
 * Request: Send signed metadata before EthereumSignTx for clear signing.
 * Host sends this BEFORE EthereumSignTx when metadata is available.
 * If not sent, existing signing flow is unchanged (backwards compatible).
 * @next EthereumMetadataAck
 * @next Failure
 */
message EthereumTxMetadata {
	optional bytes signed_payload = 1;		// Canonical signed metadata blob
	optional uint32 metadata_version = 2;		// Schema version (defaults to 1)
	optional uint32 key_id = 3;			// Embedded verification key slot (0-3)
}

/**
 * Response: Result of metadata verification.
 * @prev EthereumTxMetadata
 */
message EthereumMetadataAck {
	required uint32 classification = 1;		// 0=OPAQUE, 1=VERIFIED, 2=MALFORMED
	optional string display_summary = 2;		// Brief result for host logging
}

/**
 * Request: Load a clearsign signer public key + alias into a key slot.
 * The device shows a mandatory confirmation (alias + key fingerprint) before
 * accepting; there is no way to load a signer without user consent.
 * A signer is RAM-only and is cleared on reboot. The persist field is retained
 * for wire compatibility and future authenticated storage; firmware 7.15
 * rejects persist=true. Every transaction whose metadata was verified by a loaded
 * (non built-in) signer is preceded by a warning screen naming the alias
 * during transaction confirmation.
 * @next Success
 * @next Failure
 */
message LoadClearsignSigner {
	optional uint32 key_id = 1;		// target key slot (0-3); must not hold a built-in key
	optional bytes pubkey = 2;		// 33-byte compressed secp256k1 public key
	optional string alias = 3;		// short display name shown on load confirm + per-tx warning
	/*
	 * Optional identity logo, <= 384 bytes, run-length encoded — NOT a packed
	 * bitmap. (This is the format because draw_bitmap_mono_rle() is the decoder
	 * of record and every bundled image already uses it; it is NOT a size
	 * workaround — a packed 1bpp icon at the legal maximum geometry, 40x64,
	 * would be 320 bytes and would fit the cap.)
	 * Pixels are BYTE-VALUED intensity, one byte per pixel after decoding; the
	 * device renders each as (value * color / 100). Decoder of record:
	 * keepkey-firmware lib/board/draw.c: draw_bitmap_mono_rle().
	 *
	 * Grammar — the stream is a sequence of packets. Read n = (int8)data[i++]:
	 *   n in [1, 127]    RUN     : one value byte follows; emit it n times.  [n][v]
	 *   n in [-127, -1]  LITERAL : (-n) value bytes follow; emit each once.  [n][v1]..[v-n]
	 *   n == 0                   : invalid.
	 *   n == -128 (0x80)         : INVALID. The decoder's run counter is int8_t,
	 *                              so it cannot represent -(-128) = 128; a 0x80
	 *                              packet is undecodable. Encoders MUST split a
	 *                              128-byte literal into two packets. Firmware
	 *                              rejects 0x80 rather than rendering.
	 * The stream must decode EXACTLY, and the device validates this before the
	 * icon is shown or stored: no run may straddle the end of the image,
	 * exactly icon_width*icon_height pixels are emitted (row-major,
	 * left->right, top->bottom), and the ENTIRE input must be consumed —
	 * trailing packets after the final pixel are rejected. So a RUN emits at
	 * most 127 pixels and a LITERAL at most 127.
	 *
	 * Golden vector (2x2, w=2 h=2): bytes 03 FF FF 00
	 *   03 -> RUN of 3, value FF   => pixels [FF, FF, FF]
	 *   FF -> n = -1, LITERAL of 1 => next byte 00 => pixel [00]
	 *   decoded = FF FF FF 00  (row0 = FF FF, row1 = FF 00)
	 */
	optional bytes icon = 4;
	/*
	 * Icon pixel width, 1..40. The cap is the confirm screen's left icon column
	 * (LEFT_MARGIN_WITH_ICON = 40); title/body text begins at x=40 and the icon
	 * is drawn AFTER the text, so a wider icon would paint over the alias,
	 * fingerprint and the "NOT verified by KeepKey" warning on the trust screen.
	 * Icon + both dimensions omitted => text-only identity.
	 */
	optional uint32 icon_width = 5;
	optional uint32 icon_height = 6;	// icon pixel height (1..64; the icon column is 64px tall)
	optional bool persist = 7;		// reserved compatibility field; firmware rejects true (RAM-only)
}

////////////////////////////////////////
// Ethereum: Message signing messages //
////////////////////////////////////////

/**
 * Request: Ask device to sign message
 * @next EthereumMessageSignature
 * @next Failure
 */
message EthereumSignMessage {
	repeated uint32 address_n = 1;				// BIP-32 path to derive the key from master node
	required bytes message = 2;				// message to be signed
}

/**
 * Request: Ask device to verify message
 * @next Success
 * @next Failure
 */
message EthereumVerifyMessage {
	optional bytes address = 1;				// address to verify
	optional bytes signature = 2;				// signature to verify
	optional bytes message = 3;				// message to verify
}

/**
 * Response: Signed message
 * @prev EthereumSignMessage
 */
message EthereumMessageSignature {
	optional bytes address = 1;				// address used to sign the message
	optional bytes signature = 2;				// signature of the message
}


// EIP-712
/**
 * Request: Ask device to sign hash of typed data
 * @start
 * @next EthereumTypedDataSignature
 * @next Failure
 */
message EthereumSignTypedHash {
    repeated uint32 address_n = 1;              // BIP-32 path to derive the key from master node
    required bytes domain_separator_hash = 2;   // Hash of domainSeparator of typed data to be signed
    optional bytes message_hash = 3;            // Hash of the data of typed data to be signed (empty if domain-only data)
}

/**
 * Response: Signed typed data
 * @E712ValuesRequest
 * @end
 */
message EthereumTypedDataSignature {
    required bytes signature = 1;    						// signature of the typed data
    required string address = 2;     						// address used to sign the typed data
    optional bytes domain_separator_hash = 3;   // Hash of domainSeparator of typed data that was calculated
		required bool has_msg_hash = 4;							// message_hash is null if FALSE
    optional bytes message_hash = 5;            // Hash of the data of typed data that was calculated
}

/**
 * Request: Send the device types+domain or types+message data, return appropriate hash
 * @start
 * @next EthereumTypedDataSignature
 * @next Failure
 */
message Ethereum712TypesValues {
    repeated uint32 address_n = 1;      	// BIP-32 path to derive the key from master node
		required string eip712types = 2;			// "types" json string (up to 2048)
		required string eip712primetype = 3;	// primaryType (up to 80 bytes)
		required string eip712data = 4;				// "domain" or "message" json string (up to 2048)
		required uint32 eip712typevals = 5;		// device calculates hash for 1 = domain sep, 2 = message
}

// ── Structured EIP-712, device-driven field streaming ────────────────
//
// The device drives. It asks for one type definition, or one leaf VALUE, at a
// time, and hashes each value in the same pass that displays it. The host owns
// the document; the device holds only the digest stack for the containers
// currently open, so a 10,000-element array costs the same RAM as a 2-element
// one and there is no document-size limit to raise later.
//
// This replaces Ethereum712TypesValues, which shipped the whole document in two
// 2048-byte JSON blobs and was withdrawn in 7.14.2: its parser could not
// guarantee that the value shown on screen was the value being hashed. Here
// that property is structural -- a value is displayed and absorbed from the
// same buffer in the same call, and each member_path is requested exactly once.
//
// Shapes follow Trezor's where they can, so a host that can drive a Trezor can
// drive a KeepKey with the same traversal logic. ONE deliberate divergence is
// described at EthereumFieldType.

/**
 * Request: Begin structured EIP-712 signing. The device replies with
 * EthereumTypedDataStructRequest and drives from there.
 * @start
 * @next EthereumTypedDataStructRequest
 * @next Failure
 */
message EthereumSignTypedData {
    repeated uint32 address_n = 1;              // BIP-32 path to derive the key from master node
    required string primary_type = 2;           // primaryType of the message being signed
    optional bool metamask_v4_compat = 3 [default = true];  // array-of-struct hashing follows MetaMask v4
}

/**
 * Response: The device needs this struct's member list before it can hash.
 * @next EthereumTypedDataStructAck
 */
message EthereumTypedDataStructRequest {
    required string name = 1;                   // struct name, "EIP712Domain" for the domain
}

/**
 * Request: The member list for the struct the device just asked about, in
 * declaration order. Order is part of the signature: it determines encodeType
 * and the order encodeData concatenates members.
 * @next EthereumTypedDataStructRequest
 * @next EthereumTypedDataValueRequest
 * @next Failure
 */
message EthereumTypedDataStructAck {
    repeated EthereumStructMember members = 1;

    message EthereumStructMember {
        required EthereumFieldType type = 1;
        required string name = 2;
    }

    /**
     * DIVERGENCE FROM TREZOR, and the reason for it.
     *
     * Trezor and OneKey describe an array as a field whose `entry_type` is
     * another EthereumFieldType -- a self-referential message. Trezor can do
     * that because core is Python. OneKey does it on nanopb by compiling that
     * one field as a POINTER, which needs PB_ENABLE_MALLOC, and then flattens
     * the pointer chain into a fixed pool to sever the recursion.
     *
     * KeepKey's nanopb is static-allocation only, and a heap inside a signing
     * device is a liability we are not taking on for one field. So the array
     * nesting is FLATTENED onto the wire, the way Ledger describes it:
     * data_type is always the LEAF type, and array_levels carries the
     * dimensions.
     *
     * array_levels lists the bracket groups in the order they are written in
     * the Solidity type string, left to right -- which is the order encodeType
     * must reproduce. 0 means a dynamic dimension, N means a fixed one:
     *
     *     uint256          -> data_type=UINT,  size=32, array_levels=[]
     *     address[]        -> data_type=ADDRESS,        array_levels=[0]
     *     Person[3]        -> data_type=STRUCT, struct_name="Person",
     *                                                   array_levels=[3]
     *     int16[2][][4]    -> data_type=INT, size=2,    array_levels=[2,0,4]
     *
     * Nothing EIP-712 permits is lost, and the encoding is bounded, flat and
     * statically sized.
     */
    message EthereumFieldType {
        required EthereumDataType data_type = 1;    // the LEAF type; never ARRAY
        optional uint32 size = 2;                   // bytesN: N. intN/uintN: N in BYTES, 1..32.
        optional string struct_name = 3;            // STRUCT: its name, to request in turn
        repeated uint32 array_levels = 4;           // see above. Empty for a non-array.
    }

    // Values match Trezor's enum so a shared host implementation keeps its
    // mapping. ARRAY is reserved and never sent -- see EthereumFieldType.
    enum EthereumDataType {
        UINT = 1;
        INT = 2;
        BYTES = 3;
        STRING = 4;
        BOOL = 5;
        ADDRESS = 6;
        ARRAY = 7;     // reserved, unused
        STRUCT = 8;
    }
}

/**
 * Response: The device needs one leaf value. member_path addresses it: element
 * 0 is 0 for the domain and 1 for the message, and the rest index members and
 * array elements from there. A struct is never requested as a value -- the
 * device walks into it. An array's LENGTH is requested as its own value, big
 * endian uint16, before its elements.
 * @next EthereumTypedDataValueAck
 */
message EthereumTypedDataValueRequest {
    repeated uint32 member_path = 1;
}

/**
 * Request: The raw big-endian bytes of the requested leaf, already the exact
 * declared width. Not JSON: the device does no number parsing, so there is no
 * integer width ceiling and no decimal-to-binary step that could disagree with
 * what the host meant.
 * @next EthereumTypedDataValueRequest
 * @next EthereumTypedDataSignature
 * @next Failure
 */
message EthereumTypedDataValueAck {
    required bytes value = 1;
}
