/*
 * Messages (Zcash specific) for KeepKey Communication
 *
 * Zcash shielded transaction signing via PCZT (Partially Constructed
 * Zcash Transaction) format. Supports Orchard spend authorization.
 *
 * ---------------------------------------------------------------------------
 * BREAKING CHANGE -- Zcash wire protocol v2 (firmware 7.15 / RC18)
 * ---------------------------------------------------------------------------
 *
 * Unlike the rest of this release, the Zcash surface is NOT backward
 * compatible. Zcash shielded support shipped as a preview and had no stable
 * host implementations, so the flow was corrected in place rather than
 * duplicated behind new message IDs. A host written against Zcash v1
 * (firmware <= 7.14.x) will not interoperate with 7.15 and must be updated.
 *
 * 1. MessageType 1307 was renamed ZcashTransparentSig -> ZcashTransparentSigned
 *    and its shape changed from one signature per request
 *    (required bytes signature = 1; optional uint32 next_index = 2)
 *    to a single batched response (repeated bytes signatures = 1).
 *    The wire ID is unchanged, so a v1 host decodes 1307 into the wrong
 *    message. Generated symbol names change accordingly.
 *
 * 2. The transparent phase gained ZcashTransparentOutput (1310) and
 *    ZcashTransparentAck (1311). Transparent outputs are now streamed before
 *    inputs, and all inputs are buffered before any signature is emitted,
 *    because ZIP-244 per-input transparent sighashes commit to every
 *    transparent prevout, value, script, sequence and output. The device
 *    therefore computes the sighash itself: ZcashTransparentInput.sighash is
 *    demoted from required to optional and is REJECTED when present.
 *
 * 3. ZcashDisplayAddress fields 3-6 (address, ak, nk, rivk) were removed and
 *    reserved. FVK-match attestation against a host-built unified address is
 *    strictly weaker than device-derived display, so the device now derives
 *    and shows its own Orchard UA. A v1 host that sends those fields gets a
 *    Failure. Either account or a full address_n path is now REQUIRED.
 *
 * 4. ZcashPCZTAction.is_spend is REQUIRED by firmware 7.15, and
 *    ZcashSignedPCZT.signatures is compact: one 64-byte RedPallas signature
 *    per is_spend=true action in ascending action order, rather than one per
 *    action. A v1 host that indexes signatures by action index will read the
 *    wrong signature.
 *
 * 5. ZcashSignPCZT.sapling_digest is reserved for future Sapling support and
 *    is currently rejected when set.
 *
 * These semantics are pinned by tools/check_zcash_contract.py.
 */

syntax = "proto2";

// Sugar for easier handling in Java
option java_package = "com.keepkey.deviceprotocol";
option java_outer_classname = "KeepKeyMessageZcash";

/*
 * Orchard-family shielded pool selector.
 *
 * ORCHARD is the only value firmware 7.15 / RC18 accepts. IRONWOOD is SCHEMA
 * ONLY: that release implements no Ironwood/transaction-v6 support and rejects
 * shielded_pool=IRONWOOD with Failure. The value is allocated here so it cannot
 * be reused and so the intended NU6.3 surface is reviewable.
 */
enum ZcashShieldedPool {
    ZCASH_SHIELDED_POOL_ORCHARD = 0;
    ZCASH_SHIELDED_POOL_IRONWOOD = 1;   // SCHEMA ONLY -- rejected by firmware 7.15 / RC18
}

/**
 * Request: Sign a Zcash shielded transaction (PCZT format)
 *
 * The PCZT contains pre-constructed transaction data with proofs.
 * The device derives spend authorization keys, computes the sighash, validates
 * every Orchard action, and returns compact RedPallas signatures only for
 * actions explicitly marked is_spend=true.
 *
 * @next ZcashTransparentAck
 * @next ZcashPCZTActionAck
 * @next Failure
 */
message ZcashSignPCZT {
    repeated uint32 address_n = 1;              // ZIP-32 derivation path [32', 133', account']
    optional uint32 account = 2;                // Account index (alternative to full path)
    optional bytes pczt_data = 3;               // Serialized PCZT data (may be chunked)
    optional uint32 n_actions = 4;              // Number of Orchard actions to stream and validate
    optional uint64 total_amount = 5;           // Total ZEC amount (zatoshis) for user confirmation
    optional uint64 fee = 6;                    // Transaction fee (zatoshis)
    optional uint32 branch_id = 7;              // Consensus branch ID
    // Phase 2a: sub-digests for on-device sighash computation
    optional bytes header_digest = 8;           // 32-byte pre-computed header digest
    optional bytes transparent_digest = 9;      // 32-byte transparent digest (or empty)
    optional bytes sapling_digest = 10;         // Reserved for future Sapling support; currently rejected
    optional bytes orchard_digest = 11;         // 32-byte orchard digest
    // Phase 2b: bundle metadata for orchard digest verification
    optional uint32 orchard_flags = 12;         // Orchard bundle flags byte
    optional int64 orchard_value_balance = 13;  // Orchard value balance (LE i64)
    optional bytes orchard_anchor = 14;         // 32-byte orchard anchor
    // Phase 4: plaintext header fields for on-device header digest verification
    optional uint32 tx_version = 15;            // Transaction version (without overwinter bit)
    optional uint32 version_group_id = 16;      // Version group ID
    optional uint32 lock_time = 17;             // Transaction lock time
    optional uint32 expiry_height = 18;         // Transaction expiry height
    // NU6.3 / transaction-v6 Orchard-family pool selection. The existing
    // orchard_* metadata fields describe the selected action bundle for wire
    // compatibility; ironwood_digest is the fifth v6 transaction component.
    //
    // SCHEMA ONLY -- NOT IMPLEMENTED BY FIRMWARE 7.15 / RC18. The RC18 contract
    // is Orchard-only: that release accepts shielded_pool=ORCHARD (the default)
    // and rejects any other pool, and rejects ironwood_digest when present,
    // both with Failure. A host must not select Ironwood or send an Ironwood
    // digest against RC18 and expect the behavior this schema implies. These
    // fields are defined so tags 19-20 stay allocated and the intended NU6.3
    // surface is reviewable; the rejection is pinned by
    // tools/check_zcash_contract.py.
    optional ZcashShieldedPool shielded_pool = 19 [default = ZCASH_SHIELDED_POOL_ORCHARD];
    optional bytes ironwood_digest = 20;        // SCHEMA ONLY -- 32-byte Ironwood component
                                                // digest (v6); rejected by firmware 7.15 / RC18
    // Phase 3: transparent shielding support
    optional uint32 n_transparent_outputs = 29; // 0 for shielded-only (default)
    optional uint32 n_transparent_inputs = 30;  // 0 for shielded-only (default), >0 for hybrid shielding tx
    // Seed identity binding (ZIP-32 §6.1)
    optional bytes expected_seed_fingerprint = 31;  // 32-byte ZIP-32 §6.1 seed fingerprint:
                                                    //   BLAKE2b-256("Zcash_HD_Seed_FP",
                                                    //               I2LEBSP_8(len(seed)) || seed)
                                                    // If present, device verifies match against its own
                                                    // seed fingerprint and rejects with Failure on mismatch.
}

/**
 * Per-action signing data extracted from PCZT.
 * Sent as individual messages for streaming large transactions.
 *
 * @next ZcashSignedPCZT
 * @next ZcashPCZTActionAck
 * @next Failure
 */
message ZcashPCZTAction {
    optional uint32 index = 1;              // Action index within the Orchard bundle
    optional bytes alpha = 2;               // 32-byte spend authorization randomizer
    optional bytes sighash = 3;             // 32-byte transaction sighash (ZIP 244) - legacy mode
    optional bytes cv_net = 4;              // 32-byte value commitment
    optional uint64 value = 5;              // Action value in zatoshis (for display)
    optional bool is_spend = 6;             // REQUIRED by firmware 7.15: true only for a real spend;
                                            // false for dummy spends/output-only actions
    // Phase 2b: action fields for incremental orchard digest verification
    optional bytes nullifier = 7;           // 32-byte nullifier
    optional bytes cmx = 8;                 // 32-byte note commitment
    optional bytes epk = 9;                 // 32-byte ephemeral key
    optional bytes enc_compact = 10;        // 52-byte compact encrypted note
    optional bytes enc_memo = 11;           // 512-byte encrypted memo
    optional bytes enc_noncompact = 12;     // Remaining encrypted note bytes
    optional bytes rk = 13;                 // 32-byte randomized verification key
    optional bytes out_ciphertext = 14;     // 80-byte output ciphertext
    // Phase 4: plaintext Orchard output metadata for trusted display.
    // Firmware recomputes cmx from recipient/value/rseed and nullifier before
    // displaying the receiver/value and before emitting any signature.
    optional bytes recipient = 15;           // 43-byte Orchard receiver: d || pk_d
    optional bytes rseed = 16;               // 32-byte output note rseed
}

/**
 * Response: Acknowledgment requesting next action data
 *
 * @prev ZcashSignPCZT
 * @prev ZcashPCZTAction
 */
message ZcashPCZTActionAck {
    optional uint32 next_index = 1;         // Index of next action to process
}

/**
 * Response: Signed PCZT with spend authorization signatures
 *
 * @prev ZcashPCZTAction
 */
message ZcashSignedPCZT {
    repeated bytes signatures = 1;          // Compact 64-byte RedPallas signatures: one per
                                            // is_spend=true action, in ascending action-index order;
                                            // an all-dummy shield transaction returns zero
    optional bytes txid = 2;               // 32-byte computed transaction ID
}

/**
 * Request: Get the Orchard Full Viewing Key for a given account.
 *
 * The FVK (ak, nk, rivk) is safe to export - it allows viewing
 * transactions but cannot spend funds. Used to construct unified addresses.
 *
 * @next ZcashOrchardFVK
 * @next Failure
 */
message ZcashGetOrchardFVK {
    repeated uint32 address_n = 1;          // ZIP-32 derivation path [32', 133', account']
    optional uint32 account = 2;            // Account index (alternative to full path)
    optional bool show_display = 3;         // Show on device display
}

/**
 * Response: Orchard Full Viewing Key components.
 *
 * ak = [ask]G on Pallas curve (serialized point, 32 bytes)
 * nk = nullifier deriving key (32 bytes)
 * rivk = commitment randomness key (32 bytes)
 *
 * @prev ZcashGetOrchardFVK
 */
message ZcashOrchardFVK {
    optional bytes ak = 1;                  // 32-byte authorizing key (Pallas point)
    optional bytes nk = 2;                  // 32-byte nullifier deriving key
    optional bytes rivk = 3;               // 32-byte commitment randomness key
    optional bytes seed_fingerprint = 4;    // 32-byte ZIP-32 §6.1 seed fingerprint:
                                            //   BLAKE2b-256("Zcash_HD_Seed_FP",
                                            //               I2LEBSP_8(len(seed)) || seed)
                                            // Stable identity of the device's seed; lets a host pin an FVK
                                            // to a specific seed across sessions.
}

/**
 * Request: Transparent output data for hybrid transactions.
 * Sent before transparent inputs so the device can review standard
 * transparent recipients before any signature is emitted.
 *
 * @next ZcashTransparentAck
 * @next ZcashPCZTActionAck
 * @next Failure
 */
message ZcashTransparentOutput {
    required uint32 index = 1;              // Output index within the transaction
    optional uint64 amount = 2;             // Output value in zatoshis
    optional bytes script_pubkey = 3;       // Standard P2PKH/P2SH scriptPubKey
}

/**
 * Request: Transparent input data for hybrid shielding transactions.
 * Sent after all transparent outputs have been streamed.
 *
 * The device stores every input first because ZIP-244 per-input transparent
 * sighashes commit to all transparent prevouts, values, scripts, sequences,
 * and outputs. Host-provided sighash is legacy and rejected when present.
 *
 * @next ZcashTransparentAck
 * @next ZcashTransparentSigned
 * @next Failure
 */
message ZcashTransparentInput {
    required uint32 index = 1;              // Input index within the transaction
    optional bytes sighash = 2;             // Legacy host-computed sighash; rejected when present
    repeated uint32 address_n = 3;          // BIP44 path [44', 133', 0', 0, 0]
    optional uint64 amount = 4;             // Input value in zatoshis
    optional bytes prevout_txid = 5;        // Previous transaction ID
    optional uint32 prevout_index = 6;      // Previous output index
    optional uint32 sequence = 7;           // Input sequence
    optional bytes script_pubkey = 8;       // Previous output scriptPubKey
}

/**
 * Response: Acknowledgment requesting the next transparent item.
 *
 * @prev ZcashSignPCZT
 * @prev ZcashTransparentOutput
 * @prev ZcashTransparentInput
 */
message ZcashTransparentAck {
    optional uint32 next_output_index = 1;  // Next transparent output index
    optional uint32 next_input_index = 2;   // Next transparent input index
}

/**
 * Response: ECDSA signatures for transparent inputs.
 *
 * @prev ZcashTransparentInput
 */
message ZcashTransparentSigned {
    repeated bytes signatures = 1;          // DER ECDSA signatures, one per transparent input
}

/**
 * Request: Display the device-derived Orchard unified address on screen.
 *
 * The device derives the Orchard-only Unified Address (Sinsemilla + SWU
 * hash-to-curve, default diversifier index 0) from its own seed at the
 * requested account and shows it on the OLED with a QR code. What appears
 * on screen is bound to this device — there is no host-supplied address
 * to validate.
 *
 * Either account or a complete address_n path (m/32'/133'/account', all
 * hardened) is REQUIRED. The device rejects requests that omit both.
 *
 * Fields 3–6 (host-supplied address, ak, nk, rivk) were removed when the
 * device gained on-device UA derivation: FVK-match attestation against a
 * host-built UA is strictly weaker than device-derived display and was
 * dropped. Field numbers are reserved to prevent reuse.
 *
 * @next ZcashAddress
 * @next Failure
 */
message ZcashDisplayAddress {
    reserved 3, 4, 5, 6;
    reserved "address", "ak", "nk", "rivk";
    repeated uint32 address_n = 1;          // ZIP-32 path [32', 133', account'] — required if account omitted
    optional uint32 account = 2;            // Account index — required if address_n omitted
    optional bytes expected_seed_fingerprint = 7;  // 32-byte ZIP-32 §6.1 seed fingerprint.
                                                   // If present, device verifies match against its own
                                                   // seed fingerprint and rejects with Failure on mismatch.
}

/**
 * Response: Confirmed Zcash address after user approval on device.
 *
 * @prev ZcashDisplayAddress
 */
message ZcashAddress {
    optional string address = 1;            // Confirmed unified address
    optional bytes seed_fingerprint = 2;    // 32-byte ZIP-32 §6.1 seed fingerprint of the attesting
                                            // device. Returned alongside the confirmed address so a host
                                            // can record that this UA is bound to this device's seed.
}
